<script>
  async function getUser() {
    const res = await fetch('/.auth/me');
    const data = await res.json();
    return data.clientPrincipal;
  }

  function hasRole(principal, roleName) {
    const roles = principal?.userRoles || [];
    return roles.includes(roleName);
  }

  async function handleRedirect() {
    const principal = await getUser();

    if (!principal) return; // niet ingelogd → niks doen

    const path = window.location.pathname;

    if (hasRole(principal, "support") && !path.startsWith("/support")) {
      window.location.href = "/support/summary.html";
      return;
    }

    if (hasRole(principal, "default") && path !== "/dashboard.html") {
      window.location.href = "/dashboard.html";
      return;
    }
  }

  document.addEventListener("DOMContentLoaded", handleRedirect);
</script>
